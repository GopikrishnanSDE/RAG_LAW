<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask My Tax Docs</title>
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a65;
    --border: #e4e2db; --accent: #1f5f8b; --accent-soft: #e6eff6;
    --user: #1f5f8b; --user-text: #ffffff; --warn: #8a5a00; --warn-soft: #fbf1dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecebe6; --muted: #9b9a94;
      --border: #33332f; --accent: #7db4dc; --accent-soft: #1f2d38;
      --user: #2b6c99; --user-text: #ffffff; --warn: #e3b75c; --warn-soft: #2e2716;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header .wrap { max-width: 820px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  main { flex: 1; overflow-y: auto; padding: 20px 16px; }
  #chat { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 100%; }
  .msg.user {
    align-self: flex-end; background: var(--user); color: var(--user-text);
    padding: 9px 14px; border-radius: 14px 14px 4px 14px; max-width: 80%;
  }
  .msg.bot {
    background: var(--panel); border: 1px solid var(--border);
    padding: 14px 16px; border-radius: 14px 14px 14px 4px;
  }
  .msg.bot.refusal { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .answer { white-space: pre-wrap; }
  .cite { color: var(--accent); font-weight: 600; }
  .meta { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  details { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .source {
    margin-top: 8px; padding: 10px 12px; background: var(--accent-soft);
    border-radius: 8px; font-size: 13px;
  }
  .source h4 { margin: 0 0 4px; font-size: 13px; }
  .source .score { color: var(--muted); font-weight: 400; }
  .source pre {
    margin: 0; white-space: pre-wrap; font: inherit; max-height: 180px; overflow-y: auto;
  }
  .empty { text-align: center; color: var(--muted); margin-top: 8vh; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .examples button {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 7px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .examples button:hover { border-color: var(--accent); }
  .typing { color: var(--muted); font-style: italic; }
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; padding: 11px 14px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--bg); color: var(--text); font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.send {
    padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent);
    color: var(--panel); font: inherit; font-weight: 600; cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: default; }
  .disclaimer { max-width: 820px; margin: 6px auto 0; font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Ask My Tax Docs</h1>
    <p>Income-tax Act, 2025 · Chapter VIII deductions · answers cite the sections they come from</p>
  </div>
</header>

<main>
  <div id="chat">
    <div class="empty" id="empty">
      Ask a question about tax deductions.
      <div class="examples">
        <button>What is the deduction for interest on an education loan?</button>
        <button>How much can I deduct for life insurance premium?</button>
        <button>Deduction for donations to charitable institutions?</button>
        <button>Tax break for medical treatment of a disabled dependant?</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <form id="form">
    <input id="q" placeholder="Ask about a deduction…" autocomplete="off" maxlength="500" autofocus>
    <button class="send" type="submit">Ask</button>
  </form>
  <div class="disclaimer">Informational only, not tax advice. Answers come from a local model and can be wrong.</div>
</footer>

<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("q");
const sendBtn = form.querySelector("button");
const REFUSAL = "I don't have enough information";

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function add(cls, html) {
  document.getElementById("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.innerHTML = html;
  chat.appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "end" });
  return el;
}

function renderAnswer(d, secs) {
  const answer = esc(d.answer).replace(/\(Section[^)]*\)/g, m => `<span class="cite">${m}</span>`);
  const sources = (d.contexts || []).map(c => {
    const m = c.metadata || {};
    const score = c.rerank_score != null ? ` <span class="score">· relevance ${c.rerank_score.toFixed(2)}</span>` : "";
    return `<div class="source"><h4>Section ${esc(m.section_number)} — ${esc(m.section_title || "")}${score}</h4>
            <pre>${esc(c.text)}</pre></div>`;
  }).join("");
  const refusal = d.answer.startsWith(REFUSAL);
  return {
    cls: "bot" + (refusal ? " refusal" : ""),
    html: `<div class="answer">${answer}</div>
           <div class="meta">${esc(d.model || "")} · ${secs}s</div>
           ${sources ? `<details><summary>Retrieved sources (${d.contexts.length})</summary>${sources}</details>` : ""}`,
  };
}

async function ask(question) {
  add("user", esc(question));
  const pending = add("bot", '<span class="typing">Searching the Act and writing an answer…</span>');
  sendBtn.disabled = true;
  const t = performance.now();
  try {
    const res = await fetch("/api/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error?.message || d.error || d.detail || `HTTP ${res.status}`);
    const { cls, html } = renderAnswer(d, ((performance.now() - t) / 1000).toFixed(1));
    pending.className = "msg " + cls;
    pending.innerHTML = html;
  } catch (err) {
    pending.className = "msg bot refusal";
    pending.textContent = "Something went wrong: " + (typeof err.message === "string" ? err.message : JSON.stringify(err.message));
  } finally {
    sendBtn.disabled = false;
    input.focus();
    pending.scrollIntoView({ behavior: "smooth", block: "end" });
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const q = input.value.trim();
  if (q.length < 3 || sendBtn.disabled) return;
  input.value = "";
  ask(q);
});

document.querySelectorAll(".examples button").forEach(b =>
  b.addEventListener("click", () => ask(b.textContent))
);
</script>
</body>
</html>
