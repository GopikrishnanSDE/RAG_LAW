services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_law
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rag-core:
    build:
      context: .
      dockerfile: Dockerfile.python
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rag_law
      # Ollama runs on the host (it needs the Mac's GPU/Metal), not in compose.
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./api
    env_file: .env
    environment:
      PYTHON_SERVICE_URL: http://rag-core:8000
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - rag-core

volumes:
  pgdata:
