name: Retrieval quality eval

# Manual-only for now: a full run downloads a ~4.7 GB local model and runs
# CPU inference for every question, which is too slow (and too wasteful of
# free runner minutes) to trigger on every push. Run it from the Actions tab
# ("Run workflow") before tagging a release or after retrieval changes.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model for generation and judging"
        default: "qwen2.5:7b"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_law
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Everything runs locally on the runner: no API keys, no paid services.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rag_law
      GENERATION_MODEL: ${{ inputs.model }}
      PYTHON_SERVICE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          # CPU-only torch: the default wheel bundles ~2 GB of CUDA libraries
          # the runner can't use.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Install Node deps
        working-directory: api
        run: npm ci

      - name: Install Ollama and pull model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          npx --yes wait-on http://localhost:11434/api/version --timeout 60000
          ollama pull "$GENERATION_MODEL"

      - name: Ingest corpus
        run: python scripts/ingest.py --reset

      - name: Start RAG core service
        run: nohup uvicorn rag_core.service:app --host 0.0.0.0 --port 8000 > /tmp/core.log 2>&1 &

      - name: Start Node API layer
        working-directory: api
        run: nohup node src/index.js > /tmp/api.log 2>&1 &

      - name: Wait for services
        run: npx --yes wait-on http://localhost:8000/health http://localhost:3000/health --timeout 120000

      - name: Run eval gate
        run: python eval/run_eval.py --api-url http://localhost:3000/api/query

      - name: Service logs
        if: failure()
        run: tail -n 100 /tmp/core.log /tmp/api.log /tmp/ollama.log
